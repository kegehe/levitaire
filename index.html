<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 同步设置 data-theme 与自定义主题变量，防止窗口首次显示时闪一帧默认主题。
      // ⚠️ 必须在这里就把 `system` 解析成 light/dark：CSS 只有 `[data-theme="dark"]`
      // 这一档覆盖，把原值 "system" 直接写上去会落到 :root 的浅色默认值 ——
      // 选「跟随系统」且系统为深色时，首帧仍会闪一下浅色，要等 React 挂载后才纠正。
      // 解析口径与 themePreferences.ts 的 resolveThemeMode() 保持一致。
      //
      // 强调色/配色方案同理：applyThemePreferences() 每次应用时会把亮/暗两套完整
      // CSS 变量缓存到 levitaire-theme-boot-vars，这里按解析后的模式回放，
      // 不透明窗口（如设置页）首帧就不会再先显示默认蓝/默认方案。
      // 缓存缺失或损坏时退回 tokens.css 的默认主题，只影响挂载前的一帧。
      (function () {
        var mode = "light";
        try {
          mode = localStorage.getItem("levitaire-theme") || "light";
          if (
            mode === "system" &&
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            mode = "dark";
          }
        } catch (error) {
          // localStorage 不可用（隐私模式等）时退回浅色，不能因此中断首屏渲染
          mode = "light";
        }
        mode = mode === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", mode);

        try {
          var raw = localStorage.getItem("levitaire-theme-boot-vars");
          var cache = raw ? JSON.parse(raw) : null;
          if (cache && cache.v === 1 && cache[mode] && typeof cache[mode] === "object") {
            var style = document.documentElement.style;
            var vars = cache[mode];
            for (var name in vars) {
              // 只回放自定义属性，缓存被篡改/损坏时不至于影响其它内联样式
              if (name.indexOf("--") === 0 && Object.prototype.hasOwnProperty.call(vars, name)) {
                style.setProperty(name, vars[name]);
              }
            }
          }
        } catch (error) {
          // 缓存损坏或不可读：忽略，React 挂载后会重新应用
        }
      })();
    </script>
    <title>Levitaire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
