[package]
name = "floatory"
version = "0.1.0"
edition = "2021"
description = "Windows 浮窗工具 - 选中文字后显示工具栏"
authors = ["Floatory Contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.17"
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }
thiserror = "1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-24", "std", "tracing"] }
ndarray = { version = "0.17", features = ["std"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Media_Ocr",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Graphics_Imaging",
    "Storage_Streams",
]

[profile.release]
lto = true
strip = true
codegen-units = 1
