[package]
name = "levitaire"
version = "0.1.7"
edition = "2021"
rust-version = "1.89"
description = "Windows 浮窗工具 - 选中文字后显示工具栏"
authors = ["Levitaire Contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# 安装前复核本地缓存安装包的签名。tauri-plugin-updater 公开的 Update::install 不验签
# （校验写死在 download 里），静默升级把「下载」与「安装」拆到两个时间点后，就必须由
# 我们自己补上这一步。版本必须与 tauri-plugin-updater 内部依赖保持一致（同一份即可），
# 否则会同时存在两份 minisign-verify。校验方式：cargo tree -i minisign-verify
minisign-verify = "0.2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.17"
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
# tauri-plugin-updater 内部使用 reqwest 0.13，但关闭了其默认特性（仅 json / stream /
# rustls-no-provider）。reqwest 0.13 的 `system-proxy` 特性位于 default 中，未开启时
# 客户端只读取 HTTP_PROXY / HTTPS_PROXY 环境变量，不读取 Windows 系统代理设置，
# 会导致开局域网代理（Clash / v2ray 等系统代理模式）后更新检查与下载仍走直连而卡住。
# 通过 Cargo 特性合并为同一份 reqwest 0.13 补开该特性；代码中不直接引用此别名。
# 维护提示：特性按 major 版本合并，若将来 tauri-plugin-updater 改用 reqwest 0.14+，
# 此处版本号需同步上调，否则该特性会落到一份废弃的 reqwest 上而静默失效
# （症状：系统代理再次不生效）。验证方式：cargo tree -e features -i reqwest@<版本>
# 应能看到 system-proxy。
reqwest-0-13 = { package = "reqwest", version = "0.13", default-features = false, features = [
    "system-proxy",
] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "bmp"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }
thiserror = "1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-24", "std", "tracing"] }
ndarray = { version = "0.17", features = ["std"] }
# 桌面化加固（webview_hardening.rs）需要直接操作 WebView2 的 ICoreWebView2Settings：
# Tauri 未暴露 wry 的 with_default_context_menus，只能自己拿 controller 设置。
# 版本必须与 tauri 内部引用的 webview2-com 一致，否则 controller 的接口类型无法统一
# （校验方式：cargo tree -i webview2-com）。
webview2-com = "0.38"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    # 系统清理工具（disk_cleanup/）要直接做文件系统级操作：GetFileAttributesExW 查重解析点、
    # GetFullPathNameW/GetLongPathNameW 做不跟随链接的规范化、DeleteFileW/RemoveDirectoryW
    # 做只删链接不删目标的删除。这些都在 Win32_Storage_FileSystem 下。
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    # 转盘窗口要按「光标所在显示器」的 DPI 下发物理尺寸（quick_input::scale_at_point），
    # GetDpiForMonitor 在 Win32_UI_HiDpi 下；此前只在录制指示层用 GetDeviceCaps 近似取过系统缩放。
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Media_Ocr",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Graphics_Imaging",
    "Storage_Streams",
]

[profile.release]
lto = true
strip = true
codegen-units = 1
