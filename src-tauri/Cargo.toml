[package]
name = "levitaire"
version = "0.1.5"
edition = "2021"
description = "Windows 浮窗工具 - 选中文字后显示工具栏"
authors = ["Levitaire Contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.17"
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
# tauri-plugin-updater 内部使用 reqwest 0.13，但关闭了其默认特性（仅 json / stream /
# rustls-no-provider）。reqwest 0.13 的 `system-proxy` 特性位于 default 中，未开启时
# 客户端只读取 HTTP_PROXY / HTTPS_PROXY 环境变量，不读取 Windows 系统代理设置，
# 会导致开局域网代理（Clash / v2ray 等系统代理模式）后更新检查与下载仍走直连而卡住。
# 通过 Cargo 特性合并为同一份 reqwest 0.13 补开该特性；代码中不直接引用此别名。
# 维护提示：特性按 major 版本合并，若将来 tauri-plugin-updater 改用 reqwest 0.14+，
# 此处版本号需同步上调，否则该特性会落到一份废弃的 reqwest 上而静默失效
# （症状：系统代理再次不生效）。验证方式：cargo tree -e features -i reqwest@<版本>
# 应能看到 system-proxy。
reqwest-0-13 = { package = "reqwest", version = "0.13", default-features = false, features = [
    "system-proxy",
] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }
thiserror = "1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-24", "std", "tracing"] }
ndarray = { version = "0.17", features = ["std"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Media_Ocr",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Graphics_Imaging",
    "Storage_Streams",
]

[profile.release]
lto = true
strip = true
codegen-units = 1
